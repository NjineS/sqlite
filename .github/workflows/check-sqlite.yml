name: Check for New SQLite

on:
  workflow_dispatch:

  schedule:
    # 1st and 15th of every month, at midnight UTC
    - cron: '0 0 1,15 * *'

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Find latest SQLite version
      # ---------------------------------------------------------
      - name: Find latest SQLite version
        id: sqlite
        run: |
          set -e

          VERSION=$(
            curl -fsSL \
              https://grimler.se/termux-main/pool/main/s/sqlite/ \
              | grep -oP 'sqlite_\K[0-9.]+(?=_aarch64\.deb)' \
              | sort -V \
              | tail -n1
          )

          if [ -z "$VERSION" ]; then
            echo "Could not determine latest SQLite version."
            exit 1
          fi

          echo "Latest SQLite: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # Check whether SQLite release already exists
      # ---------------------------------------------------------
      - name: Check SQLite release
        id: sqlite_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.sqlite.outputs.version }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "SQLite release $TAG already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "SQLite release $TAG does not exist."
          fi

      # ---------------------------------------------------------
      # Trigger SQLite build when necessary
      # ---------------------------------------------------------
      - name: Trigger SQLite build
        if: steps.sqlite_release.outputs.exists == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "build-sqlite.yml",
              ref: context.ref.replace("refs/heads/", ""),
              inputs: {
                version: "${{ steps.sqlite.outputs.version }}"
              }
            });

      # ---------------------------------------------------------
      # Summary
      # ---------------------------------------------------------
      - name: Summary
        run: |
          echo "Latest SQLite: ${{ steps.sqlite.outputs.version }}"
          echo "SQLite release exists: ${{ steps.sqlite_release.outputs.exists }}"
